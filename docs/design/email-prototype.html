<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Email directions (#151)</title>
<style>
body{margin:0;font:15px/1.5 -apple-system,Helvetica,Arial,sans-serif;background:#eee;color:#222;padding:24px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:36px 0 2px}p.n{margin:0 0 12px;max-width:760px;color:#555}
.row{display:flex;gap:20px;flex-wrap:wrap}.col{flex:1 1 380px;min-width:320px}.col b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#777;margin-bottom:6px}
</style></head><body>
<h1>Notification email: three directions</h1>
<p class="n">Each shown light and dark. Everything is tables, solid colors, borders and web-safe fonts. The only image is the badge (a hosted PNG in production; drawn in CSS here). Body copy is the real "results are ready" payload.</p>
<div id="out"></div>
<script>
const L={bg:'#FFD93D',shell:'#FFFFFF',ink:'#1A1033',muted:'#4A3F6B',pink:'#FF4F9A',cobalt:'#3D5AFE',mint:'#5EEAD4',tang:'#FF8A3D',soft:'#FFF3B8',badgeText2:'#FFFFFF'};
const D={bg:'#052A3D',shell:'#0C3D55',ink:'#FFFDF5',muted:'#A8D3E0',pink:'#FF4F9A',cobalt:'#8C9EFF',mint:'#5EEAD4',tang:'#FF8A3D',soft:'#165069',badgeText2:'#FFFDF5'};
const DARK_INK='#1A1033', MONO="'Courier New',Courier,monospace", HEAD="'Arial Black','Helvetica Neue',Arial,sans-serif";
const copy={title:'Round 4 results are ready',body:'Submitters have been revealed for “Songs for a long drive”!',cta:'See who guessed correctly',foot:"You're getting this because you have a Mixtape Party account."};

// Badge: PNG in production. Pink, ink outline, tilt baked into the image.
const badge=(c,page)=>`<div style="display:inline-block;transform:rotate(-4deg);background:${c.pink};border:3px solid ${c.ink};border-radius:16px;padding:8px 14px;font:22px/.95 ${HEAD};color:${DARK_INK};text-align:center;box-shadow:3px 3px 0 ${c.ink}">Mixtape<br><span style="color:${c.badgeText2}">Party!</span></div>`;

// Bulletproof-ish button: table cell with bgcolor + border; pill radius degrades to square in Outlook desktop.
const btn=(c,label,fill)=>`<table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr><td bgcolor="${fill}" style="background:${fill};border:3px solid ${c.ink};border-bottom-width:6px;border-right-width:6px;border-radius:999px"><a href="#" style="display:inline-block;padding:12px 24px;font:bold 16px ${MONO};color:${DARK_INK};text-decoration:none">${label}</a></td></tr></table>`;

// Sticker card: 3px border, thicker bottom/right edge stands in for the hard offset shadow.
const card=(c,inner)=>`<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td bgcolor="${c.shell}" style="background:${c.shell};border:3px solid ${c.ink};border-bottom-width:7px;border-right-width:7px;border-radius:20px;padding:28px 26px">${inner}</td></tr></table>`;

const wrap=(c,pageBg,inner)=>`<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:${pageBg};font-family:${MONO};color:${c.ink};font-size:16px;line-height:1.55"><tr><td align="center" style="padding:28px 14px"><table role="presentation" width="520" cellpadding="0" cellspacing="0" border="0" style="max-width:100%;width:100%">${inner}</table></td></tr></table>`;

const foot=(c,color)=>`<tr><td align="center" style="padding:18px 8px 0;font:12px/1.5 ${MONO};color:${color}">${copy.foot}<br>Mixtape Party · <a href="#" style="color:${color}">Email settings</a></td></tr>`;

// A: Sticker Card, closest to the app. Sunshine page, white card.
const A=c=>wrap(c,c.bg,`<tr><td align="center" style="padding:6px 0 22px">${badge(c)}</td></tr><tr><td>${card(c,`
<div style="font:bold 12px ${MONO};letter-spacing:.12em;color:${c.muted};text-transform:uppercase">Round 4</div>
<h1 style="margin:6px 0 12px;font:26px/1.15 ${HEAD};color:${c.ink}">${copy.title}</h1>
<p style="margin:0 0 22px;color:${c.ink}">${copy.body}</p>${btn(c,copy.cta,c.pink)}`)}</td></tr>${foot(c,c===L?c.ink:c.muted)}`);

// B: Quiet. Neutral page, Sunshine header band only. Safest in Gmail's auto-inverted dark mode.
const B=c=>{const page=c===L?'#F4F1EA':'#031C29';return wrap(c,page,`<tr><td align="center" bgcolor="${c===L?'#FFD93D':c.bg}" style="background:${c===L?'#FFD93D':c.bg};border:3px solid ${c.ink};border-bottom:0;border-radius:20px 20px 0 0;padding:22px 0">${badge(c)}</td></tr><tr><td bgcolor="${c.shell}" style="background:${c.shell};border:3px solid ${c.ink};border-top:3px solid ${c.ink};border-radius:0 0 20px 20px;padding:28px 26px">
<h1 style="margin:0 0 12px;font:bold 22px/1.25 ${MONO};color:${c.ink}">${copy.title}</h1>
<p style="margin:0 0 22px">${copy.body}</p>${btn(c,copy.cta,c.pink)}</td></tr>${foot(c,c.muted)}`)};

// C: Cassette label. Color-stripe cells + ruled lines like the label on a tape.
const stripe=c=>`<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td height="10" width="25%" bgcolor="${c.pink}" style="background:${c.pink};font-size:0;line-height:0">&nbsp;</td><td width="25%" bgcolor="${c.tang}" style="background:${c.tang};font-size:0;line-height:0">&nbsp;</td><td width="25%" bgcolor="${c.mint}" style="background:${c.mint};font-size:0;line-height:0">&nbsp;</td><td width="25%" bgcolor="${c.cobalt}" style="background:${c.cobalt};font-size:0;line-height:0">&nbsp;</td></tr></table>`;
const C=c=>wrap(c,c.bg,`<tr><td align="center" style="padding:6px 0 22px">${badge(c)}</td></tr><tr><td>${card(c,`
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td style="font:bold 13px ${MONO};letter-spacing:.14em;color:${c.ink};padding-bottom:8px;border-bottom:2px solid ${c.ink}">SIDE A &nbsp;·&nbsp; ROUND 4</td></tr>
<tr><td style="padding:16px 0 4px;border-bottom:1px dashed ${c.muted}"><h1 style="margin:0;font:bold 24px/1.2 ${MONO};color:${c.ink}">${copy.title}</h1></td></tr>
<tr><td style="padding:14px 0 18px;border-bottom:1px dashed ${c.muted}">${copy.body}</td></tr>
<tr><td style="padding:20px 0 20px">${btn(c,copy.cta,c.pink)}</td></tr>
<tr><td style="padding:0 0 0">${stripe(c)}</td></tr></table>`)}</td></tr>${foot(c,c===L?c.ink:c.muted)}`);

const dirs=[
['A · Sticker Card','Closest to the app. Sunshine page, white card with the 3px outline and thick bottom-right edge standing in for the hard shadow. Pink pill button. Needs the page background to survive: Gmail web ignores dark-mode CSS, so this one shows its light look there.',A],
['B · Quiet','Only the header band is Sunshine; the page is neutral. Plain typewriter text. Least likely to look wrong under Gmail/Outlook forced inversion, and the plainest if clients strip styles.',B],
['C · Cassette Label','A with a tape-label structure: SIDE A / round line, dashed ruled lines, and a four-color stripe built from table cells (no images). Most personality, most table markup.',C]];
document.getElementById('out').innerHTML=dirs.map(([t,n,f])=>`<h2>${t}</h2><p class="n">${n}</p><div class="row"><div class="col"><b>Light</b>${f(L)}</div><div class="col"><b>Dark</b>${f(D)}</div></div>`).join('');
</script></body></html>
