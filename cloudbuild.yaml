# Run by a Cloud Build trigger on pushes to main (#94). A failed step stops the build,
# so a bad migration never reaches the deploy steps.
substitutions:
  _REGION: us-west1
  _REPO: us-west1-docker.pkg.dev/mixtape-party/mixtape-party
  _API_URL: https://api.mixtape-party.com

steps:
  # Writes /workspace/.skip-api and .skip-web for services unchanged since the last deploy;
  # every step below that belongs to a skipped service exits early. A failed build leaves the
  # old commit deployed, so the next build re-covers its changes.
  - id: detect
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args: ['scripts/detect-changes.sh']
    env: ['REGION=${_REGION}']

  # Runs here, not in the runtime image: `migrate` uses tsx, a devDependency.
  - id: migrate
    name: node:22-slim
    dir: api
    entrypoint: bash
    args: ['-c', '[ -e /workspace/.skip-api ] && exit 0; npm ci --ignore-scripts && npm run migrate']
    secretEnv: ['DATABASE_URL']
    waitFor: ['detect']

  - id: build-api
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ['-c', '[ -e .skip-api ] && exit 0; docker pull ${_REPO}/api:latest || true; docker build --cache-from ${_REPO}/api:latest -t ${_REPO}/api:$COMMIT_SHA -t ${_REPO}/api:latest api']
    waitFor: ['migrate']
  - id: push-api
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ['-c', '[ -e .skip-api ] && exit 0; docker push --all-tags ${_REPO}/api']
    waitFor: ['build-api']
  # Secrets are already bound to the service (#93); deploy updates only the image.
  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args: ['-c', '[ -e .skip-api ] && exit 0; gcloud run deploy mixtape-party-api --image ${_REPO}/api:$COMMIT_SHA --region ${_REGION}']
    waitFor: ['push-api']

  # EXPO_PUBLIC_API_URL is baked into the web bundle at build time.
  - id: build-web
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ['-c', '[ -e .skip-web ] && exit 0; docker pull ${_REPO}/web:latest || true; docker build --cache-from ${_REPO}/web:latest --build-arg EXPO_PUBLIC_API_URL=${_API_URL} -t ${_REPO}/web:$COMMIT_SHA -t ${_REPO}/web:latest mobile']
    waitFor: ['detect']
  - id: push-web
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ['-c', '[ -e .skip-web ] && exit 0; docker push --all-tags ${_REPO}/web']
    waitFor: ['build-web']
  # Waits for migrate too, so no deploy happens before the schema is current.
  - id: deploy-web
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args: ['-c', '[ -e .skip-web ] && exit 0; gcloud run deploy mixtape-party-web --image ${_REPO}/web:$COMMIT_SHA --region ${_REGION}']
    waitFor: ['push-web', 'migrate']

availableSecrets:
  secretManager:
    - versionName: projects/mixtape-party/secrets/DATABASE_URL/versions/latest
      env: DATABASE_URL

options:
  logging: CLOUD_LOGGING_ONLY
  # Default e2-medium is slow for `tsc` and the Expo web export.
  machineType: E2_HIGHCPU_8
