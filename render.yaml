databases:
  - name: mixtape-party-db
    databaseName: mixtape_party
    user: mixtape_party
    plan: free

services:
  - type: web
    name: mixtape-party-api
    runtime: node
    rootDir: api
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run migrate && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mixtape-party-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: PORT
        value: 3000
      - key: APPLE_MUSIC_TEAM_ID
        sync: false
      - key: APPLE_MUSIC_KEY_ID
        sync: false
      - key: APPLE_MUSIC_PRIVATE_KEY
        sync: false
      - key: APPLE_MUSIC_STOREFRONT
        value: us
      # Session cookie for one app-owned music.youtube.com account, shared across all users'
      # exports (see api/src/adapters/youtubeMusicAdapter.ts).
      - key: YOUTUBE_MUSIC_COOKIE
        sync: false
      # Resend API key and verified from-address; without them the API sends no mail at all.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # The mixtape-party-web URL — emailed reset/sign-in links and the Google sign-in handoff
      # point at the client, not the API.
      - key: APP_BASE_URL
        sync: false
      # Google OAuth client. GOOGLE_REDIRECT_URI is this API's own callback and must match an
      # authorised redirect URI on the client exactly; it is never derived from the Host header.
      # Unset, Google sign-in is simply off rather than broken.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false

  - type: web
    name: mixtape-party-web
    runtime: node
    rootDir: mobile
    plan: free
    buildCommand: npm install && npx expo export -p web
    # ponytail: `expo serve` is Expo's documented local-preview command, not a hardened prod
    # server — it does not yet satisfy #36's Node/SSR requirement for real traffic. Replace
    # with a custom Node/Express server on expo-server's adapter
    # (docs.expo.dev/router/web/server-rendering) before this service takes real traffic.
    startCommand: npx expo serve
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://mixtape-party-api.onrender.com
