<!doctype html>
<html><head><meta charset="utf-8"><title>Search results asset</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&display=swap">
<style>
:root{--bg:#FFD93D;--ink:#1A1033;--pink:#FF4F9A;--mint:#5EEAD4;--f:'Bagel Fat One','Arial Rounded MT Bold',sans-serif}
html,body{margin:0;width:1920px;height:1280px;overflow:hidden;background:var(--mint)}
h1{position:absolute;top:110px;left:0;right:0;margin:0;text-align:center;font:104px/1 var(--f);color:var(--ink);transform:rotate(-2deg)}
.p{position:absolute;width:520px;top:330px;border:8px solid var(--ink);border-radius:64px;box-shadow:16px 16px 0 var(--ink);display:block;background:var(--bg)}
#l{left:110px;transform:rotate(-8deg) translateY(50px)}
#r{right:110px;transform:rotate(8deg) translateY(50px)}
#c{left:700px;width:520px;top:290px;z-index:2}
.s{position:absolute;z-index:3;right:170px;top:230px;width:230px;height:230px;border-radius:50%;background:var(--mint);border:6px solid var(--ink);box-shadow:10px 10px 0 var(--ink);display:grid;place-items:center;text-align:center;font:40px/1 var(--f);transform:rotate(12deg)}
</style></head><body>
<h1>Guess who picked the song</h1>
<img class="p" id="l" src="../screenshots/4-results.png">
<img class="p" id="r" src="../screenshots/2-submit.png">
<img class="p" id="c" src="../screenshots/3-guess.png">
</body></html>
