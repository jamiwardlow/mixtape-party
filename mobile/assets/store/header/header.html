<!doctype html>
<html><head><meta charset="utf-8"><title>Header video</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Courier+Prime:wght@400;700&display=swap">
<style>
:root{--bg:#FFD93D;--ink:#1A1033;--c3:#5EEAD4;--f-display:'Bagel Fat One','Arial Rounded MT Bold',sans-serif;--f-body:'Courier Prime','Courier New',monospace}
html,body{margin:0;width:1920px;height:823px;overflow:hidden;background:var(--bg)}
.stage{position:absolute;left:460px;top:91px;width:1000px;height:640px}
.k{position:absolute;filter:drop-shadow(10px 10px 0 var(--ink))}
.k svg{display:block;width:100%;height:auto}
#a{width:620px;left:0;top:30px}
#b{width:490px;right:0;bottom:0}
.kb{fill:#FF4F9A;stroke:var(--ink);stroke-width:4}.kl{fill:#fff;stroke:var(--ink);stroke-width:2.4}.ks{fill:#3D5AFE}
.kt{fill:var(--ink);font:700 14px var(--f-body);letter-spacing:.02em}
.kw{fill:var(--ink);stroke:var(--ink);stroke-width:2}.kd{fill:var(--ink)}.kf{fill:rgba(0,0,0,.18)}
.ktp{fill:#2a1b12}.kh{fill:#fff;stroke:var(--ink);stroke-width:1.5}.kr2{stroke:var(--ink);stroke-width:2;stroke-linecap:round;fill:none}
.kr{stroke:#fff;stroke-width:1.2;stroke-linecap:round;fill:none;opacity:.35}
.reel{transform-box:fill-box;transform-origin:center}
#b .kb{fill:#3D5AFE}#b .ks{fill:#5EEAD4}
.sticker{position:absolute;right:30px;top:-10px;z-index:2;background:var(--c3);border:5px solid var(--ink);border-radius:50%;width:200px;height:200px;display:grid;place-items:center;text-align:center;font:33px/1 var(--f-display);box-shadow:9px 9px 0 var(--ink);padding:18px;box-sizing:border-box}
</style></head><body>
<div class="stage">
<div class="sticker" id="s">Who<br>picked<br>it?!</div>
<div class="k" id="a"></div><div class="k" id="b"></div>
</div>
<script>
const K=t=>`<svg viewBox="0 0 200 130" role="img" aria-label="Cassette tape"><rect class="kb" x="3" y="3" width="194" height="124" rx="10"/><rect class="kl" x="13" y="11" width="174" height="76" rx="4"/><rect class="ks" x="13" y="11" width="174" height="12" rx="4"/><text class="kt" x="100" y="40" text-anchor="middle">${t}</text><path class="kr" d="M30 44H170" style="stroke:#1A1033"/><rect class="kw" x="38" y="49" width="124" height="29" rx="14.5"/><g transform="translate(53 63.5)"><circle r="13" class="ktp"/><g class="reel"><circle r="7.5" class="kh"/><path class="kr2" d="M0-7.5V-4M6.5 3.7L3.5 2M-6.5 3.7L-3.5 2"/></g></g><g transform="translate(147 63.5)"><circle r="10" class="ktp"/><g class="reel"><circle r="7.5" class="kh"/><path class="kr2" d="M0-7.5V-4M6.5 3.7L3.5 2M-6.5 3.7L-3.5 2"/></g></g><path class="kf" d="M40 127L52 94H148L160 127z"/><rect class="kd" x="91" y="104" width="18" height="9" rx="2"/><circle class="kd" cx="68" cy="114" r="4.5"/><circle class="kd" cx="132" cy="114" r="4.5"/><rect class="kd" x="78" y="120" width="5" height="4" rx="1"/><rect class="kd" x="117" y="120" width="5" height="4" rx="1"/><circle class="kd" cx="9" cy="9" r="2.5"/><circle class="kd" cx="191" cy="9" r="2.5"/><circle class="kd" cx="9" cy="121" r="2.5"/><circle class="kd" cx="191" cy="121" r="2.5"/></svg>`;
a.innerHTML=K('Pick a song');b.innerHTML=K('Guess the picker');
const T=8,P=2*Math.PI;
// Every motion has a period that divides T=8s, so frame(0) == frame(T): a seamless loop.
window.setT=t=>{
  const w=(per,ph=0)=>Math.sin(P*(t/per+ph));
  a.style.transform=`translateY(${12*w(4)}px) rotate(${-7+1.5*w(8)}deg)`;
  b.style.transform=`translateY(${-12*w(4,.25)}px) rotate(${9-1.5*w(8)}deg)`;
  s.style.transform=`rotate(${12+6*w(2)}deg) scale(${1+.05*w(4,.1)})`;
  document.querySelectorAll('.reel').forEach(r=>r.style.transform=`rotate(${360*t/4}deg)`);
};
setT(0);
</script></body></html>
